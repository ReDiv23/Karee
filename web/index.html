<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Karee</h1>
    <p>Watch a tiny functional program run, one reduction at a time.</p>
  </header>

  <main>
    <section class="editor">
      <div class="row">
        <label for="examples">Program</label>
        <select id="examples"></select>
        <input id="nameInput" type="text" maxlength="40" aria-label="Program name" hidden>
        <button id="rename" aria-label="Rename program" title="Rename (your own programs only)">✎</button>
        <button id="remove" aria-label="Delete program" title="Delete (your own programs only)">✕</button>
        <button id="new" aria-label="New program" title="New blank program">＋</button>
        <button id="saveas" aria-label="Save a copy" title="Save a copy as…">⧉</button>
        <button id="run" class="primary" title="Ctrl/Cmd + Enter">Run</button>
      </div>
      <textarea id="src" spellcheck="false" rows="4" aria-label="Program"></textarea>
      <div id="error" class="error" hidden></div>
    </section>

    <section id="stage" class="stage" hidden>
      <div class="view" role="group" aria-label="View">
        <button id="viewCode" class="seg" aria-pressed="true">Code</button>
        <button id="viewTree" class="seg" aria-pressed="false">Tree</button>
      </div>
      <div id="expr" class="expr" aria-live="polite"></div>
      <div id="treeWrap" class="treewrap" hidden>
        <div class="treetools">
          <span class="treehint">scroll to zoom · drag to pan</span>
          <button id="zout" aria-label="Zoom out">−</button>
          <button id="zin" aria-label="Zoom in">＋</button>
          <button id="zfit">Fit</button>
        </div>
        <svg id="tree" role="img" aria-label="Syntax tree of the current expression"></svg>
      </div>
      <div class="meta"><span id="rule" class="badge"></span><span id="caption"></span></div>

      <div id="boxes" class="boxes" hidden>
        <div id="boxLabel" class="label"></div>
        <div class="strip">
          <div id="acc" class="box acc" hidden><small>acc</small><b id="accText"></b></div>
          <div id="items" class="items"></div>
        </div>
      </div>

      <div id="banner" class="banner" hidden></div>
    </section>

    <section id="controls" class="controls" hidden>
      <div class="buttons">
        <button id="first" aria-label="Back to start" title="Back to start (Home)">|◀</button>
        <button id="prev"  aria-label="Step back" title="Step back (←)">◀</button>
        <button id="play"  class="primary" aria-label="Play" title="Play / pause (Space)">▶</button>
        <button id="next"  aria-label="Step forward" title="Step forward (→)">▶|</button>
        <button id="last"  aria-label="Jump to end" title="Jump to end (End)">▶▶|</button>
      </div>
      <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Timeline">
      <span id="counter" class="counter"></span>
      <label class="speed">Speed <input id="speed" type="range" min="1" max="10" value="3"></label>
    </section>
  </main>

  <script src="karee.js"></script>
  <script src="examples.js"></script>
  <script src="player.js"></script>
  <script src="tree.js"></script>
  <script src="app.js"></script>
</body>
</html>
